# 홈페이지 챗봇 지식베이스
# - 손슬기 회계사의 견적서·제안서 문구를 바탕으로, 고객명·금액을 빼고 일반화해 정리했습니다.
# - 가격은 안내하지 않고(산정 방식만), 연락처는 _config.yml 의 contact 값만 씁니다.
# - keys: 방문자가 입력할 만한 낱말. 질문(q)·키워드가 많이 겹칠수록 먼저 답합니다.
# - chip: 처음 화면의 빠른 질문 버튼에 보일 이름(없으면 버튼 없음).
# - a 안의 {email} {tel} {hours} 는 사이트 연락처로 바뀝니다.

# ───────── 보조금 정산검증 ─────────
- id: settle-overview
  chip: 사업비 정산
  q: 보조금·연구개발비 정산검증은 어떤 일을 하나요?
  keys: [정산, 정산검증, 사업비, 보조금, 국고보조금, 지방보조금, 연구개발비, 보조사업, 정산보고서, 검증]
  a: |
    국고·지방보조금과 연구개발비의 <b>정산검증</b>을 주로 맡고 있어요.
    정산 시점에 증빙만 보는 게 아니라, 집행 단계부터 함께 보면서 사후에 불인정·환수가 생기지 않도록 예방하는 데 힘을 두고 있습니다.
    사업 규모와 일정에 맞춰 진행 방식을 제안드릴게요.
  links: [[정산 견적 요청, /downloads/], [보조금법 정산 대상 정리, /insights/subsidy-act-settlement-guide/]]

- id: settle-process
  q: 정산검증은 어떤 순서로 진행되나요?
  keys: [순서, 절차, 단계, 진행, 프로세스, 과정, 어떻게]
  topic: [정산, 검증, 보조금, 사업비]
  a: |
    보통 <b>6단계</b>로 진행해요. 착수·준비 → 상시 모니터링(사전통제) → 회계정산 → 보완·확정 → 부정수급 검증 → 반납·보고 순서입니다.
    단계마다 체크리스트와 검토조서를 남겨서, 어떤 근거로 인정·불인정했는지 나중에도 추적할 수 있도록 하고 있어요.

- id: settle-precontrol
  q: 사전통제(사전검토)는 무엇인가요?
  keys: [사전통제, 사전검토, 사전, 미리, 집행전, 집행 전, 불인정, 환수, 예방]
  a: |
    일정 금액(예: 100만 원) 이상 집행 건을 <b>집행 전이나 직후에 회계사가 먼저 검토</b>하는 절차예요.
    보조사업자가 등록하면 증빙·집행기준·예산 범위·세무처리를 검토하고, 발주기관이 최종 승인하는 구조입니다.
    사후 불인정과 환수 분쟁을 미리 줄이는 게 목적이에요.

- id: settle-mixed
  q: 국비와 지방비가 섞인 사업은 어떻게 정산하나요?
  keys: [국비, 지방비, 시비, 도비, 매칭, 분담, 분담비율, e나라도움, 이나라도움, 보탬e, 보탬이, 중복, 이자]
  a: |
    e나라도움·보탬e 등 <b>시스템별 집행액을 건별로 맞춰</b> 분담비율을 확인하고, 중복계상이나 누락이 없는지 찾아냅니다.
    잔액과 발생이자도 재원별로 나눠서 산정해 드려요.

- id: settle-objection
  q: 불인정 결과에 이의가 있으면 어떻게 하나요?
  keys: [이의, 이의신청, 불인정, 불복, 재검토, 소명]
  a: |
    이의신청을 주시면 담당 회계사가 정산 근거를 다시 검토하고, 필요하면 법률 검토도 거칩니다.
    쟁점이 되는 건은 내부 위원회에서 같은 기준으로 심의한 뒤, 수용 여부와 근거를 함께 안내드려요.

- id: settle-ai
  q: AI를 쓰면 증빙 자료가 외부로 새지 않나요?
  keys: [AI, 인공지능, 보안, 유출, 개인정보, 마스킹, 자동화]
  a: |
    개인정보가 담긴 자료는 <b>외부 공개형 AI에 넣지 않아요.</b> 식별정보는 마스킹한 뒤 격리된 환경에서만 처리합니다.
    AI는 1차 선별을 돕는 도구일 뿐이고, 인정·불인정의 최종 판단과 책임은 담당 공인회계사가 집니다. "기술로 거르고, 사람이 판단한다"가 원칙이에요.

- id: settle-education
  q: 보조사업자 교육도 해주나요?
  keys: [교육, 설명회, 방문교육, 착수교육, 증빙, 양식, 자료집]
  a: |
    네, 해드려요. 착수교육 → 증빙실무 → 중간점검 → 정산 마무리 순서로 단계별 교육을 진행하고, 요청하시면 방문교육도 가능합니다.
    비목별 증빙 샘플 양식과 Q&A 자료집도 함께 드려요.

- id: settle-deliverables
  q: 정산검증 결과물로 무엇을 받나요?
  keys: [결과물, 보고서, 산출물, 제출물, 총괄표, 정산결과보고서]
  a: |
    착수보고서, 주별·월별 정산현황 총괄표, 대상자별 정산결과보고서, 종합분석보고서, 질의응답집을 드립니다.
    사업 성격에 따라 필요한 것만 골라 구성할 수도 있어요.

- id: settle-personnel
  q: 인건비 정산에서 자주 문제가 되는 건 무엇인가요?
  keys: [인건비, 참여율, 실지급, 급여, 4대보험, 퇴직급여, 중복참여]
  a: |
    인건비는 <b>참여율과 실제 지급액</b>이 서로 맞는지에서 가장 많이 갈려요.
    여러 사업에 인력이 겹쳐 참여한다면 사업별 참여율에 따라 급여·4대보험·퇴직급여 배분표를 만들어 두는 게 안전합니다.
  links: [["관련 글: 인건비 정산", /insights/personnel-cost-settlement/]]

# ───────── 공동주택·조합 감사 ─────────
- id: apt-audit
  chip: 아파트 회계감사
  q: 아파트(공동주택) 회계감사는 의무인가요?
  keys: [아파트, 공동주택, 관리사무소, 입주자대표회의, 입대의, 관리비, 외부회계감사, 회계감사, 의무]
  a: |
    의무 대상 공동주택은 <b>매 회계연도 외부 회계감사</b>를 받아야 해요(공동주택관리법 제26조).
    회계연도 종료 후 <b>9개월 이내</b>에 감사를 마쳐야 하고, 감사보고서는 감사일부터 1개월 이내에 제출합니다(같은 법 시행령 제27조).
    단지 일정에 맞춰 진행해 드릴게요.
  links: [[감사 견적 요청, /downloads/], [공동주택 수익사업 정리, /insights/apartment-profit-business-registration/]]

- id: apt-process
  q: 아파트 회계감사는 어떤 순서로 진행되나요?
  keys: [순서, 절차, 단계, 진행, 현장감사, 금융기관, 조회]
  topic: [아파트, 공동주택, 단지, 관리사무소]
  a: |
    자료 요청·검토 → 금융기관 조회 → 관리사무소 현장감사 → 감사보고서 제출 → K-apt 공개·구청 제출 순서로 진행돼요.
    K-apt 공개와 구청 제출까지 저희가 직접 챙겨 드립니다.

- id: apt-scope
  q: 아파트 회계감사에서는 무엇을 보나요?
  keys: [무엇을, 범위, 재무상태표, 운영성과표, 장기수선충당금, 장충금, 잡수입, 관리규약, 지출증빙]
  topic: [아파트, 공동주택, 단지, 감사]
  a: |
    재무상태표, 운영성과표, 이익잉여금처분계산서, 주석을 감사합니다.
    특히 관리비 부과·징수, 장기수선충당금, 잡수입 집행, 예금 잔액, 지출 증빙을 꼼꼼히 보고, 관리규약 위반 사항이 있으면 '중요한 발견사항'으로 알려드려요.

- id: apt-cost
  q: 감사 때 조회 수수료나 인쇄비가 따로 드나요?
  keys: [실비, 수수료, 인쇄비, 출장비, 추가비용, 별도비용, 따로]
  a: |
    아니요. 금융기관 조회 수수료, 보고서 인쇄·제본비, 출장비 같은 <b>실비는 저희가 부담</b>하고 따로 청구하지 않아요.

- id: apt-after
  q: 감사가 끝난 뒤에도 설명을 들을 수 있나요?
  keys: [설명, 감사후, 사후, 권고, 개선, 연중, 문의]
  a: |
    네. 입주자대표회의에서 요청하시면 감사보고서와 개선 권고사항을 직접 설명드려요(시행령 제27조 제7항).
    연중 회계 문의도 편하게 주시면 됩니다.

- id: apt-tax
  q: 아파트 잡수입도 세금 신고를 해야 하나요?
  keys: [잡수입, 재활용, 알뜰장터, 중계기, 임대료, 수익사업, 법인세, 부가세, 사업자등록]
  a: |
    재활용품 판매, 알뜰장터, 중계기 임대료 같은 잡수입은 성격에 따라 <b>법인세 수익사업이나 부가가치세 과세사업</b>에 해당할 수 있어요.
    관련 내용을 글로 정리해 두었으니 함께 보시면 좋습니다.
  links: [[아파트 잡수입 세금 처리, /insights/apartment-misc-income-tax/], [수익사업 vs 과세사업, /insights/apartment-corporate-tax-vs-vat/]]

- id: apt-fee-vat
  q: 아파트 관리비에도 부가가치세가 붙나요?
  keys: [관리비, 면세, 국민주택규모, 85, 위탁관리, 경비, 청소]
  topic: [아파트, 공동주택, 관리비]
  a: |
    두 가지를 보시면 돼요. 먼저 <b>자치관리인지 위탁관리인지</b>, 그다음 <b>국민주택규모(전용 85㎡) 이하인지</b>입니다.
    위탁관리라도 국민주택규모 이하 세대에 공급하는 일반관리·경비·청소 용역은 부가가치세가 면세되고, 초과 세대 부분은 과세돼요(조세특례제한법).
    자세한 기준은 글로 정리해 두었습니다.
  links: [[관리비 부가세 면세 정리, /insights/apartment-management-fee-vat-exemption/]]

- id: union-timing
  q: 지역주택조합 회계감사는 언제 받아야 하나요?
  keys: [지역주택조합, 주택조합, 조합, 조합설립인가, 사업계획승인, 사용검사, 주택법]
  a: |
    주택법상 <b>세 번</b> 받아야 해요.
    ① 조합설립인가 후 3개월이 지난 날부터 30일 이내 ② 사업계획승인 후 3개월이 지난 날부터 30일 이내 ③ 사용검사 신청일부터 30일 이내입니다.
    감사 결과는 감사 종료일부터 15일 이내에 관할 시장·군수·구청장과 조합에 통보돼요.

- id: union-focus
  q: 조합 감사에서는 무엇을 중점적으로 보나요?
  keys: [분담금, 환불, 탈퇴, 업무대행비, 토지, 브릿지, PF, 차입금, 공사비, 일반분양, 소송]
  topic: [조합, 지역주택조합, 재건축, 재개발]
  a: |
    분담금 수납과 탈퇴자 환불금, 업무대행비, 토지 매입, 브릿지·PF 차입금, 공사비 증액, 일반분양, 소송, 사업비 정산을 중점적으로 봐요.
    감사 중에 오류나 불일치가 보이면 바로 조합과 협의해서 보고서 발행 전에 해소하도록 도와드립니다.

- id: union-docs
  q: 조합은 감사 때 어떤 자료를 준비해야 하나요?
  keys: [준비, 자료, 준비물, 서류, 요청자료, 명부, 의사록, 계약서]
  topic: [조합, 지역주택조합, 감사]
  a: |
    재무제표와 부속명세서, 직전 단계 감사보고서, 금융거래조회 신청서, 각종 계약서와 총회 의사록, 조합원 명부와 분담금·환불 내역, 소송 현황을 준비해 주시면 돼요.
    빠진 자료가 있으면 진행하면서 함께 정리해 드릴게요.

- id: audit-partner
  q: 담당 회계사가 중간에 바뀌나요?
  keys: [담당자, 담당, 바뀌, 변경, 직접, 파트너, 경력, 경험]
  a: |
    아니요. 경력 15년 이상의 담당 회계사가 현장감사와 소통을 <b>직접 맡고</b>, 계약부터 보고서 발행까지 담당자가 바뀌지 않아요.
    감사보고서는 발행 전에 법인 품질관리부서의 심리를 한 번 더 거칩니다.

- id: external-audit
  chip: 외부감사 대상
  q: 우리 회사도 외부감사 대상인가요?
  keys: [외부감사, 외감, 외감법, 외감대상, 감사대상, 감사인, 감사인선임, 법인, 주식회사, 유한회사, 500억]
  a: |
    직전 사업연도 말 기준으로 <b>자산 또는 매출 500억 원 이상</b>이거나, 자산 120억·부채 70억·매출 100억·종업원 100명 중 <b>2개 이상</b>에 해당하면 대상이에요(외감법 제4조).
    처음 대상이 되면 감사인 선임 기한도 있으니, 아래 글에서 함께 확인해 보세요.
  links: [[외부감사 대상 판정 기준, /insights/external-audit-criteria/], [감사 상담, /contact/]]

# ───────── 세무기장 ─────────
- id: tax-overview
  chip: 세무기장·신고
  q: 세무기장을 맡기면 무엇을 해주나요?
  keys: [기장, 세무기장, 장부, 기장료, 세무대리, 법인세, 부가세, 부가가치세, 종합소득세, 원천세, 신고, 세무]
  a: |
    장부기장과 월별 손익 보고, 부가세 신고, 급여대장 작성, 원천세·4대보험 신고, 지급명세서 제출이 기본으로 들어가요.
    홈택스·4대보험 EDI 대리와 평소 세무 상담도 함께 해드립니다.
  links: [[기장·신고 상담, /contact/], [세무 자료 요청, /downloads/]]

- id: tax-extra
  q: 기장료 외에 따로 비용이 드는 업무는 무엇인가요?
  keys: [별도, 추가, 따로, 연말정산, 결산, 세무조정, 세무조사, 규정]
  topic: [기장, 세무, 비용]
  a: |
    연말정산, 결산·세무조정, 사업별 인건비 배분 관리, 사업비 정산자료 대사, 규정안 작성, 세무조사 대응 같은 업무는 별도예요.
    <b>미리 협의하지 않은 비용은 청구하지 않으니</b> 안심하셔도 됩니다.

- id: tax-start
  q: 기장을 맡기면 무엇부터 시작하나요?
  keys: [시작, 착수, 수임, 위임, 이관, 인수, 처음, 계약]
  topic: [기장, 세무]
  a: |
    계약 후 홈택스 세무대리 수임 동의와 4대보험 EDI 위임을 받아요.
    그다음 기존 장부와 신고자료를 넘겨받아 한 번 검토하고, 월 기장을 시작합니다.

- id: tax-monthly
  q: 매달 어떤 자료를 보내야 하나요?
  keys: [매달, 매월, 월별, 자료, 보내, 통장, 거래내역, 카드, 현금영수증, 세금계산서]
  topic: [기장, 세무, 자료]
  a: |
    세금계산서·카드·현금영수증은 홈택스와 카드사 등록으로 자동으로 모여요.
    통장 거래내역과 급여 변동 사항만 <b>다음 달 10일까지</b> 보내주시면 됩니다.

- id: tax-multi-project
  q: 여러 정부지원사업에 인력이 겹쳐도 급여 관리가 되나요?
  keys: [정부지원사업, 지원사업, 겹치, 겹쳐, 배분, 배분표, 급여관리]
  topic: [기장, 급여]
  a: |
    네, 가능해요. 사업별 참여율에 따라 급여·4대보험·퇴직급여 배분표를 만들고 급여대장과 맞춰 관리합니다.
    급여 이체내역처럼 사업비 증빙에 필요한 자료도 처음부터 함께 세팅해 드려요.

- id: tax-ceo-pay
  q: 대표 급여나 비과세 수당도 검토해 주나요?
  keys: [대표급여, 대표, 임원, 보수, 상여, 비과세수당, 식대, 자가운전보조금, 손금]
  a: |
    네. 착수할 때 임원 보수·상여가 손금으로 인정되는 요건과 식대·자가운전보조금 등 비과세 요건을 한 번 점검하고 조정 의견을 드려요.

- id: vat
  q: 부가가치세 신고나 매입세액공제가 궁금해요
  keys: [부가세, 부가가치세, 매입세액, 매입세액공제, 예정신고, 확정신고, 세금계산서]
  a: |
    매입세액공제는 사업자가 꼭 챙겨야 하는 부분이라 따로 글로 정리해 두었어요. 신고 기한과 유의사항도 함께 보시면 좋습니다.
  links: [[매입세액공제 정리, /insights/vat-input-tax-credit/], [3분기 부가세 신고 유의사항, /insights/vat-2026-q3-preliminary-return/]]

- id: sole-tax
  q: 개인사업자 종합소득세 절세 방법이 있나요?
  keys: [개인사업자, 종합소득세, 종소세, 절세, 간편장부, 복식부기]
  a: |
    간편장부 대상인지부터 확인하시는 게 시작이에요. 자주 놓치는 절세 포인트를 글로 정리해 두었습니다.
  links: [[개인사업자 절세 포인트, /insights/sole-proprietor-tax-tips/], [세금계산기, /calculators/]]

- id: real-estate-tax
  q: 양도세·종부세 같은 부동산 세금도 상담하나요?
  keys: [부동산, 양도세, 양도소득세, 종부세, 종합부동산세, 취득세, 재산세, 주택, 다주택, 1세대, 비과세, 세제개편]
  a: |
    부동산 세제는 개정이 잦아서, 최신 내용을 따로 정리해 두고 매달 업데이트하고 있어요.
    비과세나 중과 여부는 보유 기간·거주 여부·주택 수에 따라 결과가 달라지니, 구체적인 사안은 상담으로 확인해 주세요.
  links: [[부동산 세제 최신판, /real-estate-tax/], [2026 부동산 세제개편안 정리, /insights/real-estate-tax-reform-2026/], [세금계산기, /calculators/]]

