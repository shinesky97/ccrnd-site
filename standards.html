---
layout: default
title: 회계기준서
permalink: /standards/
sitemap: false
noindex: true
app: true
extra_css: /assets/css/standards.css
description: 관리자 전용 회계기준서 열람 페이지입니다.
---
<div class="std-app" id="std-app">
  <div id="std-setup" class="std-card std-warn" hidden>Firebase 설정이 아직 없어 이용할 수 없습니다.</div>

  <form id="std-login" class="std-card std-login" hidden>
    <h2>회계기준서 · 관리자 로그인</h2>
    <p class="std-muted">기준서 원문은 저작권 보호를 위해 관리자에게만 표시됩니다.</p>
    <label for="std-email">이메일</label><input id="std-email" type="email" required autocomplete="username">
    <label for="std-pw">비밀번호</label><input id="std-pw" type="password" required autocomplete="current-password">
    <button class="std-btn" type="submit">로그인</button>
    <p id="std-err" class="std-login-err"></p>
  </form>

  <div id="std-bar" class="std-toolbar" hidden style="justify-content:flex-end;margin-bottom:4px">
    <span id="std-who" class="std-muted" style="font-size:.85rem"></span>
    <button id="std-logout" class="std-btn sm ghost" type="button">로그아웃</button>
  </div>
  <div id="std-root"></div>
</div>

{% include firebase-init.html %}
<script type="module">
  import { startStandardsApp, firebaseStore } from '{{ "/assets/js/standards-app.js" | relative_url }}?v={{ site.time | date: "%Y%m%d%H%M%S" }}';

  const $ = (id) => document.getElementById(id);
  // 로컬 화면 점검용(배포 사이트에서는 쓰이지 않음): localhost 에서 window.__STD_TEST_STORE__ 가 있으면 그것을 사용
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && window.__STD_TEST_STORE__) {
    startStandardsApp($('std-root'), window.__STD_TEST_STORE__);
  } else if (!window.CCRND_FB_READY) {
    $('std-setup').hidden = false;
  } else {
    const V = '10.12.0';
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } =
      await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(window.CCRND_FB);
    const auth = getAuth(app);
    const db = fs.getFirestore(app);
    const ADMIN = window.CCRND_FB.adminEmail;
    let started = false;

    $('std-login').addEventListener('submit', async (e) => {
      e.preventDefault(); $('std-err').textContent = '';
      try { await signInWithEmailAndPassword(auth, $('std-email').value.trim(), $('std-pw').value); }
      catch (_) { $('std-err').textContent = '로그인에 실패했습니다. 이메일·비밀번호를 확인해 주세요.'; }
    });
    $('std-logout').addEventListener('click', () => signOut(auth).then(() => location.reload()));

    onAuthStateChanged(auth, (user) => {
      const ok = user && (!ADMIN || user.email === ADMIN);
      $('std-login').hidden = !!ok; $('std-bar').hidden = !ok;
      if (ok) {
        $('std-who').textContent = user.email;
        if (!started) { started = true; startStandardsApp($('std-root'), firebaseStore(fs, db, user.uid)); }
      } else if (user) {
        $('std-err').textContent = '이 계정은 열람 권한이 없습니다.'; signOut(auth);
      }
    });
  }
</script>
