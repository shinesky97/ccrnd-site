<header class="site">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-name">손슬기 한국공인회계사</span>
      <span class="brand-sub">CPA · INSIGHTS</span>
    </a>
    <nav class="menu">
      {%- for item in site.nav -%}
        <a href="{{ item.url | relative_url }}"
           {% if item.cta %}class="cta"{% endif %}
           {% if page.url contains item.url and item.url != '/' %}aria-current="page"{% endif %}>{{ item.name }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
