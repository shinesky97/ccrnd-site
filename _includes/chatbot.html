<!-- 상담 챗봇 (서버·AI 없이 동작) — 질문을 입력하면 _data/chatbot.yml 문답과 인사이트 글(FAQ 포함)에서 찾아 답합니다 -->
<div id="cbot" class="cbot" aria-live="polite">
  <button id="cbot-toggle" class="cbot-toggle" aria-expanded="false" aria-controls="cbot-panel">
    <span class="cbot-toggle-open">💬 상담</span>
    <span class="cbot-toggle-close" aria-hidden="true">✕</span>
  </button>

  <div id="cbot-panel" class="cbot-panel" role="dialog" aria-label="상담 챗봇" hidden>
    <div class="cbot-head">
      <div>
        <strong>공인회계사 손슬기</strong>
        <span>궁금한 점을 편하게 물어보세요</span>
      </div>
      <button id="cbot-close" class="cbot-close" type="button" aria-label="대화창 닫기">✕</button>
    </div>
    <div id="cbot-log" class="cbot-log"></div>
    <div id="cbot-quick" class="cbot-quick"></div>
    <form id="cbot-form" class="cbot-form" autocomplete="off">
      <input id="cbot-input" type="text" maxlength="200" placeholder="예: 아파트 회계감사 기한이 언제예요?" aria-label="질문 입력">
      <button type="submit" aria-label="보내기">↑</button>
    </form>
    {%- if site.contact.kakao and site.contact.kakao != "" -%}
    <a class="cbot-kakao" href="{{ site.contact.kakao }}" target="_blank" rel="noopener">
      <span class="cbot-kakao-ico" aria-hidden="true">💬</span> 카카오톡 1:1 상담하기
    </a>
    {%- endif -%}
    <div class="cbot-foot">
      <a href="{{ '/contact/' | relative_url }}">✉️ 바로 문의하기</a>
      <span>· 답변은 일반 안내이며, 구체적인 사안은 상담으로 확인해 주세요.</span>
    </div>
  </div>
</div>

<script>
(function () {
  var BASE = "{{ '/' | relative_url }}".replace(/\/$/, '');
  var u = function (p) { return /^https?:/.test(p) ? p : BASE + p; };
  var CONTACT = { email: {{ site.contact.email | jsonify }}, tel: {{ site.contact.tel | jsonify }}, hours: {{ site.contact.hours | jsonify }} };

  // 문답 지식베이스 (_data/chatbot.yml)
  var KB = {{ site.data.chatbot | jsonify }};
  // 인사이트 글 (검색 제외 글·자동 브리핑 제외)
  var POSTS = [
    {%- for p in site.posts -%}{%- unless p.noindex -%}
    { t: {{ p.title | jsonify }}, url: {{ p.url | jsonify }}, tags: {{ p.tags | jsonify }}, d: {{ p.description | default: p.excerpt | strip_html | truncate: 120 | jsonify }},
      faq: [{%- for f in p.faq -%}{ q: {{ f.q | jsonify }}, a: {{ f.a | jsonify }} }{% unless forloop.last %},{% endunless %}{%- endfor -%}] },
    {%- endunless -%}{%- endfor -%}
  ];

  var log = document.getElementById('cbot-log');
  var quick = document.getElementById('cbot-quick');
  var panel = document.getElementById('cbot-panel');
  var toggle = document.getElementById('cbot-toggle');
  var form = document.getElementById('cbot-form');
  var input = document.getElementById('cbot-input');
  var greeted = false, lastTopic = '';

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fill(s) { return s.replace(/\{(email|tel|hours)\}/g, function (_, k) { return esc(CONTACT[k]); }); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s·.,?!~()'"“”‘’\[\]\/-]+/g, ''); }
  function grams(s) { var n = norm(s), g = {}; for (var i = 0; i < n.length - 1; i++) g[n.substr(i, 2)] = 1; return g; }
  function overlap(qg, s) { // 질문 2글자 묶음 중 대상 문장에 있는 비율
    var tg = grams(s), hit = 0, tot = 0;
    for (var k in qg) { tot++; if (tg[k]) hit++; }
    return tot ? hit / tot : 0;
  }
  function keyScore(nq, keys) {
    var s = 0;
    (keys || []).forEach(function (k) { var nk = norm(k); if (nk.length >= 2 && nq.indexOf(nk) >= 0) s += 1 + Math.min(nk.length, 6) / 6; });
    return s;
  }

  function bubble(who, html) {
    var d = document.createElement('div');
    d.className = 'cbot-msg cbot-' + who;
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function linksHtml(links) {
    if (!links || !links.length) return '';
    return '<div class="cbot-links">' + links.map(function (l) {
      return '<a href="' + esc(u(l[1])) + '">' + esc(l[0]) + ' →</a>';
    }).join('') + '</div>';
  }

  // 질문 → 가장 알맞은 답 찾기
  function find(q) {
    var nq = norm(q), qg = grams(q);
    var best = null;
    KB.forEach(function (e) {
      var ks = keyScore(nq, e.keys), ts = keyScore(nq, e.topic);
      var s = ks * 1.2 + overlap(qg, e.q) * 3;
      if (e.topic) { // 주제 낱말(예: 아파트)이 질문에 없으면 직전 대화 주제와 맞을 때만 인정
        if (ts) s += ts; else if (lastTopic && e.topic.some(function (t) { return norm(t) === lastTopic; })) s += 0.8; else s *= 0.45;
      }
      if (!best || s > best.s) best = { s: s, kind: 'kb', e: e };
    });
    POSTS.forEach(function (p) {
      (p.faq || []).forEach(function (f) {
        var s = overlap(qg, f.q) * 4 + keyScore(nq, p.tags) * 0.8;
        if (!best || s > best.s) best = { s: s, kind: 'faq', f: f, p: p };
      });
    });
    return best && best.s >= 1.6 ? best : null;
  }
  function relatedPosts(q, exclude) {
    var nq = norm(q), qg = grams(q);
    return POSTS.map(function (p) {
      return { p: p, s: keyScore(nq, p.tags) + overlap(qg, p.t) * 3 };
    }).filter(function (x) { return x.s >= 1.2 && exclude.indexOf(x.p.url) < 0; })
      .sort(function (a, b) { return b.s - a.s; }).slice(0, 2).map(function (x) { return x.p; });
  }

  function reply(q) {
    var hit = find(q), html, used = [];
    if (hit && hit.kind === 'kb') {
      var e = hit.e;
      html = fill(e.a.trim()).replace(/\n/g, '<br>');
      (e.links || []).forEach(function (l) { used.push(u(l[1])); });
      var rel = relatedPosts(q, used).map(function (p) { return ['관련 글: ' + p.t, p.url]; });
      html += linksHtml((e.links || []).concat(rel).slice(0, 4));
      if (e.topic) lastTopic = norm(e.topic[0]); else if (e.keys && e.keys[0]) lastTopic = norm(e.keys[0]);
    } else if (hit && hit.kind === 'faq') {
      html = md(hit.f.a) + '<br><span class="cbot-src">자세한 내용은 글에 정리해 두었어요.</span>' + linksHtml([[hit.p.t, hit.p.url]]);
    } else {
      var rel2 = relatedPosts(q, []);
      html = '말씀하신 내용은 상황에 따라 답이 달라질 수 있어서, 직접 확인하고 답변드리는 게 정확할 것 같아요. ' +
        '문의를 남겨주시면 빠르게 회신드릴게요.' +
        linksHtml(rel2.map(function (p) { return ['관련 글: ' + p.t, p.url]; }).concat([['문의 남기기', '/contact/']]));
    }
    bubble('bot', html);
  }
  function ask(q) {
    q = String(q || '').trim();
    if (!q) return;
    bubble('user', esc(q));
    setTimeout(function () { reply(q); }, 220);
  }

  function renderQuick() {
    quick.innerHTML = '';
    KB.filter(function (e) { return e.chip; }).forEach(function (e) {
      var b = document.createElement('button');
      b.className = 'cbot-chip';
      b.type = 'button';
      b.textContent = e.chip;
      b.addEventListener('click', function () { ask(e.q); });
      quick.appendChild(b);
    });
  }
  function greet() {
    if (greeted) return;
    greeted = true;
    bubble('bot', '안녕하세요, 공인회계사 손슬기입니다. 정산·감사·세무에 대해 궁금한 점을 아래에 적어주시거나 주제를 골라주세요. 🙂');
    renderQuick();
  }
  function open() {
    panel.hidden = false;
    toggle.setAttribute('aria-expanded', 'true');
    document.getElementById('cbot').classList.add('cbot-on');
    greet();
    if (window.matchMedia('(min-width: 600px)').matches) input.focus();
  }
  function close() {
    panel.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    document.getElementById('cbot').classList.remove('cbot-on');
  }
  form.addEventListener('submit', function (ev) { ev.preventDefault(); ask(input.value); input.value = ''; });
  toggle.addEventListener('click', function () { panel.hidden ? open() : close(); });
  document.getElementById('cbot-close').addEventListener('click', close);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) close();
  });
})();
</script>
