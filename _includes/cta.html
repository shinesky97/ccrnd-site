<section class="cta-band" aria-label="상담·견적 안내">
  <div class="wrap cta-inner">
    <h2>정산을 맡길 회계법인을 찾고 계신가요?</h2>
    <p>과업 규모·사업 유형·정산 시기만 알려주시면, <strong>{{ site.contact.cta }}</strong>드립니다.

      <a class="btn btn-gold" href="mailto:{{ site.contact.email }}?subject=[정산검증] 견적·제안 요청&body=기관명%3A%20%0A사업명%2F유형%3A%20%0A사업비 규모%3A%20%0A정산 시기%3A%20%0A연락처%3A%20">이메일로 견적 요청</a>
      <a class="btn btn-ghost light" href="tel:{{ site.contact.tel | remove: '-' }}">전화 {{ site.contact.tel }}</a>
    </div>
    <p class="cta-sub">{{ site.contact.email }} · {{ site.contact.tel }} · {{ site.contact.address }} · 담당 공인회계사 손슬기</p>
  </div>
</section>
