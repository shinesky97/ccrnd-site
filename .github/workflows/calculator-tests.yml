name: Calculator regression tests
on:
  pull_request:
    paths:
      - calculators.html
      - tests/calculators.test.cjs
      - .github/workflows/calculator-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/calculators.test.cjs
