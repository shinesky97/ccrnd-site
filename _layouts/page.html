---
layout: default
---
<div class="page-head">
  <div class="wrap-narrow">
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</div>

<section style="border-top:0;padding-top:40px">
  <div class="wrap-narrow article-body">
    {{ content }}
  </div>
</section>
