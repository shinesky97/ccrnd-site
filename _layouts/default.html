<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{%- if site.keywords and site.keywords != "" -%}<meta name="keywords" content="{{ site.keywords }}">{%- endif -%}
{%- if site.naver_verification and site.naver_verification != "" -%}<meta name="naver-site-verification" content="{{ site.naver_verification }}">{%- endif -%}
{%- feed_meta -%}
{%- seo -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Accountant",
  "name": "공인회계사 손슬기",
  "alternateName": ["손슬기 회계사", "손슬기 공인회계사"],
  "founder": { "@type": "Person", "name": "손슬기", "jobTitle": "공인회계사(KICPA)" },
  "url": "{{ site.url }}",
  "email": "{{ site.contact.email }}",
  "telephone": "{{ site.contact.tel }}",
  "areaServed": "KR",
  "knowsAbout": ["회계감사", "외부감사", "세무기장", "세무신고", "사업비 정산검증", "국고보조금 정산", "연구개발비 정산"],
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ site.contact.address }}",
    "addressLocality": "서울",
    "addressCountry": "KR"
  }
}
</script>
</head>
<body>

{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}

</body>
</html>
