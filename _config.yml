# ───────────────────────── Jekyll 빌드 설정 ─────────────────────────
permalink: /insights/:title/
paginate: 6
paginate_path: /insights/page:num/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

feed:
  path: /feed.xml

# 기본값: 모든 _posts 글에 post 레이아웃 자동 적용
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: 손슬기

exclude:
  - DESIGN.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - scripts
  - .pages.yml
  - package.json
  - package-lock.json
  - node_modules
