# ───────────────────────── 콘텐츠 분류 ─────────────────────────
# key      : 글 front matter의 category 값 / URL slug
# name     : 화면 표기 이름
# short    : 라벨용 짧은 이름
# color    : 라벨 강조색 (CSS 변수명)
# desc     : 카테고리 목록 페이지 설명
categories_meta:
  - key: settlement
    name: 사업비·정산 실무
    short: 정산실무
    color: inju
    desc: 국고보조금·연구개발비 정산검증 실무, 자주 마주치는 정산 사례와 증빙 포인트.
  - key: tax
    name: 세무 정보
    short: 세무
    color: blue
    desc: 종합소득세·부가세·법인세·연말정산 등 실무 세무 정보와 절세 포인트.
  - key: accounting
    name: 회계·결산 정보
    short: 회계결산
    color: green
    desc: 결산 실무, K-IFRS, 재무제표 읽는 법 등 회계 정보.
  - key: notice
    name: 공지·자료실
    short: 공지
    color: ink
    desc: 서식 배포, 법령 개정 소식, 공지사항.

